<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
            color: #1e293b;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        header {
            background: #1d4ed8;
            color: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            margin-top: 0;
        }

        .version {
            display: inline-block;
            background: white;
            color: #1d4ed8;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000d;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 16px;
            margin-top: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .feedback-item {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
        }

        .rating {
            color: #b45309;
            font-weight: bold;
        }

        .muted {
            color: #64748b;
            font-size: 13px;
        }

        .message {
            margin-top: 12px;
            font-weight: bold;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(150px, 1fr)
            );
            gap: 10px;
        }

        .filters label {
            margin-top: 0;
        }

        .filters button {
            align-self: end;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Feedback System</h1>

        <p>
            Submit feedback, view responses and explore ratings.
        </p>

        <span class="version" id="versionBadge">
            Loading version...
        </span>
    </header>

    <!-- V1: Submit feedback -->
    <section class="card" id="submitSection">
        <h2>Submit Feedback</h2>

        <form id="feedbackForm">

            <label for="name">Name</label>
            <input
                id="name"
                name="name"
                required
            >

            <label for="email">Email</label>
            <input
                id="email"
                name="email"
                type="email"
                required
            >

            <label for="message">Feedback</label>
            <textarea
                id="message"
                name="message"
                required
            ></textarea>

            <label for="rating">Rating</label>
            <select id="rating" name="rating" required>
                <option value="">Select rating</option>
                <option value="1">1 - Poor</option>
                <option value="2">2 - Fair</option>
                <option value="3">3 - Good</option>
                <option value="4">4 - Very Good</option>
                <option value="5">5 - Excellent</option>
            </select>

            <button type="submit">
                Submit Feedback
            </button>
        </form>

        <div class="message" id="submitMessage"></div>
    </section>

    <!-- V2: View feedback -->
    <section class="card" id="viewSection">
        <h2>All Feedback</h2>

        <button id="loadFeedback">
            Load Feedback
        </button>

        <div id="feedbackList"></div>
    </section>

    <!-- V3: Filter and sort -->
    <section class="card" id="filterSection">
        <h2>Filter and Sort Feedback</h2>

        <div class="filters">

            <div>
                <label for="filterRating">Rating</label>

                <select id="filterRating">
                    <option value="">All ratings</option>
                    <option value="1">1 star</option>
                    <option value="2">2 stars</option>
                    <option value="3">3 stars</option>
                    <option value="4">4 stars</option>
                    <option value="5">5 stars</option>
                </select>
            </div>

            <div>
                <label for="searchTerm">Search</label>

                <input
                    id="searchTerm"
                    placeholder="Name or feedback"
                >
            </div>

            <div>
                <label for="sortOrder">Sort by</label>

                <select id="sortOrder">
                    <option value="">Default order</option>
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="rating-high">Highest rating</option>
                    <option value="rating-low">Lowest rating</option>
                </select>
            </div>

            <button id="filterButton">
                Apply Filters
            </button>
        </div>

        <div id="filteredList"></div>
    </section>

</div>

<script>
    const submitSection =
        document.getElementById("submitSection");

    const viewSection =
        document.getElementById("viewSection");

    const filterSection =
        document.getElementById("filterSection");

    const feedbackList =
        document.getElementById("feedbackList");

    const filteredList =
        document.getElementById("filteredList");

    let currentVersion = "v1";

    async function initialize() {
        try {
            const response = await fetch("/health");

            const data = await response.json();

            currentVersion = data.version;

            document.getElementById("versionBadge").textContent =
                "Application " + currentVersion.toUpperCase();

            submitSection.hidden = currentVersion !== "v1";
            viewSection.hidden = currentVersion !== "v2";
            filterSection.hidden = currentVersion !== "v3";

        } catch (error) {
            document.getElementById("versionBadge").textContent =
                "Unable to connect";
        }
    }

    function displayFeedback(container, items) {
        container.replaceChildren();

        if (!items.length) {
            const empty = document.createElement("p");
            empty.textContent = "No feedback entries found.";
            container.appendChild(empty);
            return;
        }

        items.forEach(item => {
            const card = document.createElement("article");
            card.className = "feedback-item";

            const heading = document.createElement("h3");
            heading.textContent = item.name;

            const rating = document.createElement("p");
            rating.className = "rating";
            rating.textContent = "Rating: " + item.rating + "/5";

            const message = document.createElement("p");
            message.textContent = item.message;

            const date = document.createElement("p");
            date.className = "muted";
            date.textContent =
                new Date(item.createdAt).toLocaleString();

            card.append(heading, rating, message, date);
            container.appendChild(card);
        });
    }

    // V1: Submit feedback.
    document.getElementById("feedbackForm")
        .addEventListener("submit", async event => {
            event.preventDefault();

            const form = new FormData(event.target);

            const body = {
                name: form.get("name"),
                email: form.get("email"),
                message: form.get("message"),
                rating: Number(form.get("rating"))
            };

            const messageElement =
                document.getElementById("submitMessage");

            try {
                const response = await fetch("/feedback", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Submission failed");
                }

                messageElement.textContent =
                    "Feedback submitted successfully!";

                event.target.reset();

            } catch (error) {
                messageElement.textContent = error.message;
            }
        });

    // V2: View feedback.
    document.getElementById("loadFeedback")
        .addEventListener("click", async () => {
            try {
                const response = await fetch("/feedback");

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Unable to load feedback");
                }

                displayFeedback(feedbackList, data.feedback);

            } catch (error) {
                feedbackList.textContent = error.message;
            }
        });

    // V3: Filter and sort feedback.
    document.getElementById("filterButton")
        .addEventListener("click", async () => {
            const params = new URLSearchParams();

            const rating =
                document.getElementById("filterRating").value;

            const search =
                document.getElementById("searchTerm").value.trim();

            const sort =
                document.getElementById("sortOrder").value;

            if (rating) params.set("rating", rating);
            if (search) params.set("search", search);
            if (sort) params.set("sort", sort);

            try {
                const response = await fetch(
                    "/feedback/filter?" + params.toString()
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Filtering failed");
                }

                displayFeedback(filteredList, data.feedback);

            } catch (error) {
                filteredList.textContent = error.message;
            }
        });

    initialize();
</script>

</body>
</html>
